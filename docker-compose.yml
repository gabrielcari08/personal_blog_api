services:
  # ============================================================================
  # PostgreSQL
  # ============================================================================
  db:
    image: postgres:16-alpine

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app_db}",
        ]
      interval: 3s
      timeout: 3s
      retries: 5

  # ============================================================================
  # FastAPI
  # ============================================================================
  api:
    build:
      context: ./backend
      target: runner

    restart: unless-stopped

    command: uvicorn app.entrypoints.api.main:app --host 0.0.0.0 --port 8000 --reload

    ports:
      - "8000:8000"

    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./specs:/app/specs

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app_db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-prod}

    depends_on:
      db:
        condition: service_healthy

  # ============================================================================
  # Frontend (Vite + React, modo desarrollo con hot reload)
  # ============================================================================
  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    command: npm run dev -- --host 0.0.0.0

    ports:
      - "5173:5173"

    volumes:
      # Código fuente en vivo para recarga en caliente.
      - ./frontend:/app
      # Volumen anónimo: evita que el node_modules del host pise el del contenedor.
      - /app/node_modules

    environment:
      # Dentro de la red de compose el backend responde en el servicio "api".
      VITE_API_PROXY_TARGET: http://api:8000
      # El watcher no detecta cambios del bind mount de Windows; se usa polling.
      VITE_USE_POLLING: "true"

    depends_on:
      - api

volumes:
  postgres_data:
